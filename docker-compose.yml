services:
  my-redis-server:
    image: redis:8.12-rc3
    expose:
      - "6379"
    volumes:
      - redis-data-fresh:/data

  redis-docker-express-app:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - my-redis-server
    volumes:
      - ./src:/usr/app/src

volumes:
  redis-data-fresh:
